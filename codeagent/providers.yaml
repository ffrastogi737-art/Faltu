# Provider registry. Provider-level facts only: no model names, no keys.
# Models are discovered at runtime from each provider's list endpoint
# (or from models_extra.yaml when a provider has none).
#
# Fields:
#   api:        openai | gemini | cohere | horde  (adapter to use)
#   base_url:   API root; {VAR} placeholders are filled from env vars
#   key_env:    env var holding the key (provider is skipped if it is empty)
#   models:     list endpoint path or full URL, or "extra" to read models_extra.yaml
#   enabled:    false = never routed to (history is kept)
#   status:     live | paid-only | dead | unclear | unverified
#               unverified = written from knowledge, not yet confirmed by a
#               live probe; the first `agent providers probe` replaces it.
#   allow_private_code: may this provider see workspace code?
#               false unless its data policy is confirmed safe.
#   free_tier:  true | false | unknown
#
# Add any OpenAI-compatible provider with:
#   agent providers add <name> --base-url <url> --key-env <VAR>
# There is no limit on how many entries this file holds.

providers:
  gemini:
    api: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    key_env: GEMINI_API_KEY
    models: /models
    enabled: true
    status: unverified
    free_tier: true
    allow_private_code: false   # free-tier prompts may be used for training
  openrouter:
    api: openai
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
