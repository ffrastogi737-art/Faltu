[project]
name = "marketintel"
version = "0.1.0"
description = "Indian stock market research and prediction agent (research only, no order placement)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0",
  "apscheduler>=3.10,<4", "httpx>=0.27", "reportlab>=4", "tzdata",
]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["marketintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
