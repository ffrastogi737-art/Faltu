pluginManagement {
    repositories {
        google()
        // Google's mirror of Maven Central (works where repo.maven.apache.org is rate-limited)
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    }
}
rootProject.name = 'WhatIf'
include ':app'
