# Render Blueprint: one web service (API + customer app + admin app) and one PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository. Plans and prices: https://render.com/pricing
services:
  - type: web
    name: jewellery
    runtime: node
    region: singapore
    plan: starter            # paid plan: needed for the disk (product photos) and the Shell
    rootDir: jewellery
    buildCommand: >-
      cd backend && npm ci &&
      cd ../customer-app && npm ci --include=dev && npm run build &&
      cd ../admin-app && npm ci --include=dev && npm run build
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: jewellery-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: STATIC_DIR
        value: ../customer-app/dist
      - key: ADMIN_STATIC_DIR
        value: ../admin-app/dist
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: VAPID_FILE
        value: /var/data/vapid.json
      - key: VAPID_SUBJECT
        sync: false          # set to mailto:your-email when asked

databases:
  - name: jewellery-db
    region: singapore
    plan: basic-256mb
    databaseName: jewellery
    user: jewel
