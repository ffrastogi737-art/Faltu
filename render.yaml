# Render Blueprint (free plan): one web service = API + customer app (/) + admin app (/admin/).
# Database: a free PostgreSQL from neon.tech (Render's free database is deleted after 30 days).
# Photos and push keys are stored in the database, so no disk is needed.
# Render dashboard -> New -> Blueprint -> pick this repository; fill the values marked sync: false.
services:
  - type: web
    name: jewellery
    runtime: node
    region: singapore
    plan: free
    rootDir: jewellery
    buildCommand: >-
      cd backend && npm ci &&
      cd ../customer-app && npm ci --include=dev && npm run build &&
      cd ../admin-app && npm ci --include=dev && npm run build
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: STATIC_DIR
        value: ../customer-app/dist
      - key: ADMIN_STATIC_DIR
        value: ../admin-app/dist
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL       # Neon "direct" connection string (host without -pooler), ends with ?sslmode=require
        sync: false
      - key: OWNER_NAME         # first owner login, created on first start
        sync: false
      - key: OWNER_MOBILE
        sync: false
      - key: OWNER_PASSWORD     # min 8 characters; change it after first login, then delete this variable
        sync: false
      - key: VAPID_SUBJECT      # mailto:your-email (for push notifications)
        sync: false
