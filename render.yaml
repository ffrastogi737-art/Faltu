# Render Blueprint — dashboard/API only (free web service; sleeps after 15 min idle, ~1 min wake).
# Rendering does NOT run here (512 MB / 0.1 CPU is too small) — it runs in GitHub Actions.
services:
  - type: web
    name: gta6-command-center
    runtime: docker
    rootDir: gta6-engine
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: MEDIA_DIR
        value: /tmp/gta6media
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: YT_CLIENT_ID
        sync: false
      - key: YT_CLIENT_SECRET
        sync: false
      - key: YT_REFRESH_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: GH_DISPATCH_TOKEN
        sync: false
      - key: GH_REPO
        sync: false
      - key: REQUIRE_APPROVAL
        value: "true"
