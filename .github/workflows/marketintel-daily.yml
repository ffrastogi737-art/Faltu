# Runs the market research engine once per weekday morning (07:17 IST) and saves the result
# to the `marketintel-data` branch: latest.json, latest.pdf and the append-only prediction ledger.
# Research output only. Nothing here can place an order.
name: marketintel daily
on:
  schedule:
    - cron: "47 1 * * 1-5"
  workflow_dispatch:
    inputs:
      indices:
        description: "Index lists to scan (comma separated)"
        default: "NIFTY 500"
permissions:
  contents: write
concurrency: marketintel-daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INDICES: ${{ inputs.indices || 'NIFTY 500' }}
      DATA_DIR: ${{ github.workspace }}/out/inputs   # optional fundamentals.csv / holidays.csv / fno.csv / events.csv
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: marketintel/pyproject.toml
      - run: pip install ./marketintel
      - name: Restore saved data
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads "$url" marketintel-data >/dev/null; then
            git clone --depth 1 --branch marketintel-data "$url" out
          else
            mkdir out && cd out && git init -q -b marketintel-data && git remote add origin "$url"
          fi
      - name: Research run
        working-directory: marketintel
        run: python -m marketintel daily ../out
      - name: Save results
        working-directory: out
        run: |
          git add -A
          git -c user.name="marketintel-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "data $(date -u +%F)" || exit 0
          git push -q origin marketintel-data
