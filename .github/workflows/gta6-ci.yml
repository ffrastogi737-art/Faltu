name: gta6-tests
on:
  push: { paths: ['gta6-engine/**', '.github/workflows/gta6-*'] }
  pull_request: { paths: ['gta6-engine/**'] }
  workflow_dispatch:
defaults: { run: { working-directory: gta6-engine } }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg, POSTGRES_DB: gta }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: gta6-engine/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - run: pip install -r requirements.txt
      - name: gta6-tests (sqlite)
        run: pytest -q
      - name: gta6-tests (postgres)
        run: pytest -q
        env: { DATABASE_URL: "postgresql+psycopg2://postgres:pg@localhost:5432/gta" }
