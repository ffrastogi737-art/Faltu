# Job-based compute: GitHub spins up a runner, renders queued jobs, uploads media
# to R2, writes state to Supabase, then shuts down. No always-on server.
name: gta6-worker
on:
  schedule:
    - cron: "15 1,7,13 * * *"   # 06:45, 12:45, 18:45 IST
  workflow_dispatch:
    inputs:
      task: { description: "research | work | stats | yt-test", default: "work" }
defaults: { run: { working-directory: gta6-engine } }
concurrency: { group: gta6-worker, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MEDIA_DIR: /tmp/gta6media
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD || '0' }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'edge' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      NEWS_RSS_FEEDS: ${{ vars.NEWS_RSS_FEEDS }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      REQUIRE_APPROVAL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: gta6-engine/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - run: pip install -r requirements.txt
      - name: health
        run: python -m app.cli init
      - name: scheduled cycle
        if: github.event_name == 'schedule'
        run: |
          python -m app.cli research
          python -m app.cli plan
          python -m app.cli work 10
          python -m app.cli stats || true
          python -m app.cli report
      - name: manual task
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.task }}" in
            research) python -m app.cli research && python -m app.cli plan ;;
            work) python -m app.cli work 10 ;;
            stats) python -m app.cli stats ;;
            yt-test) python -m app.cli yt-test ;;
          esac
          python -m app.cli report
